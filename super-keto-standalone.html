<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>סופר-קטו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!--
  =====================================================================
  הגדרת Firebase — יש למלא כאן את הפרטים מהפרויקט שלכם ב-Firebase
  (הוראות מלאות בהודעה שבה קיבלתם את הקובץ הזה)
  =====================================================================
-->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  var FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
</script>
<!-- ===================================================================== -->

<style>
  :root{
    --bg:#F4FAFD;
    --bg-soft:#E8F3FA;
    --card:#FFFFFF;
    --card-hover:#EEF6FB;
    --card-selected:#DFF0FA;
    --navy:#1E4E6E;
    --navy-dark:#153A54;
    --accent:#F0913E;
    --accent-dark:#D97B2E;
    --tomato:#D2574A;
    --text:#1E2A32;
    --text-dim:#5B6B77;
    --text-faint:#96A5AF;
    --border:rgba(30,78,110,0.12);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Rubik',sans-serif; min-height:100%;}
  body{padding-bottom:110px;}
  h1,h2,h3{margin:0; font-family:'Rubik',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input{font-family:inherit;}

  /* ---------- Name gate ---------- */
  #gate{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px; padding:24px;
  }
  #gate .logo-mark{width:96px; height:96px; object-fit:contain;}
  #gate h1{font-size:34px; font-weight:800; color:var(--navy); letter-spacing:-0.5px;}
  #gate p{color:var(--text-dim); font-size:15px; text-align:center; max-width:280px; line-height:1.6; margin:0;}
  #gate .gate-box{width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px;}
  #gate input{
    background:var(--card); border:1.5px solid var(--border); color:var(--text);
    padding:15px 16px; border-radius:14px; font-size:16px; text-align:center; outline:none;
  }
  #gate input:focus{border-color:var(--accent);}
  #gate button.go{
    background:var(--accent); color:#FFFFFF; font-weight:700; font-size:16px;
    padding:14px; border-radius:14px; transition:transform .15s ease, background .15s ease;
  }
  #gate button.go:active{transform:scale(0.97);}
  #gate button.go:disabled{opacity:0.4;}

  /* ---------- Header ---------- */
  header{padding:26px 20px 18px; position:relative;}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-logo{width:46px; height:46px; object-fit:contain; flex-shrink:0; display:block;}
  .brand-text h1{font-size:26px; font-weight:800; color:var(--navy); letter-spacing:-0.4px;}
  .brand-text p{margin:2px 0 0; font-size:13px; color:var(--text-dim);}
  .me-badge{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border);
    padding:7px 12px 7px 8px; border-radius:999px; flex-shrink:0; box-shadow:0 1px 3px rgba(30,78,110,0.08);
  }
  .avatar{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#FFFFFF; flex-shrink:0;
  }
  .me-badge span{font-size:13px; font-weight:600;}

  .underline-swirl{width:120px; height:8px; margin-top:10px; opacity:0.9;}

  /* ---------- Category chips ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:4px 20px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    display:flex; align-items:center; gap:6px; flex-shrink:0; padding:10px 16px; border-radius:999px;
    background:var(--card); border:1.5px solid var(--border); color:var(--text-dim); font-size:14px; font-weight:600;
    transition:background .15s ease, color .15s ease, border-color .15s ease; box-shadow:0 1px 3px rgba(30,78,110,0.06);
  }
  .chip svg{width:16px; height:16px;}
  .chip.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
  .chip .chip-count{
    background:rgba(0,0,0,0.18); border-radius:999px; font-size:11px; padding:1px 6px; margin-inline-start:2px;
  }
  .chip.active .chip-count{background:rgba(0,0,0,0.25);}

  /* ---------- Search ---------- */
  .search-row{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--border);
    border-radius:14px; padding:0 14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(30,78,110,0.06);
  }
  .search-row svg{width:17px; height:17px; color:var(--text-faint); flex-shrink:0;}
  .search-row input{
    flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:14.5px;
    padding:12px 0; min-width:0;
  }
  .search-row input::placeholder{color:var(--text-faint);}
  .search-clear{
    width:22px; height:22px; border-radius:50%; background:var(--bg-soft); color:var(--text-dim);
    display:none; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
  }
  .search-clear.show{display:flex;}

  /* ---------- Product list ---------- */
  main{padding:18px 20px 20px;}
  .cat-title{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cat-title svg{width:22px; height:22px; color:var(--accent);}
  .cat-title h2{font-size:19px; font-weight:700;}

  .product-grid{display:flex; flex-direction:column; gap:10px;}
  .product-row{
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; display:flex; align-items:center; gap:12px; transition:background .15s ease, border-color .15s ease;
    box-shadow:0 1px 3px rgba(30,78,110,0.06);
  }
  .product-row.selected{background:var(--card-selected); border-color:var(--accent);}
  .check{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--text-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:all .15s ease;
  }
  .product-row.selected .check{background:var(--accent); border-color:var(--accent);}
  .check svg{width:14px; height:14px; opacity:0; transition:opacity .1s ease; color:#FFFFFF;}
  .product-row.selected .check svg{opacity:1;}
  .p-name{flex:1; font-size:15px; font-weight:500; min-width:0;}
  .p-name .p-note{display:block; font-size:12px; color:var(--text-dim); font-weight:400; margin-top:2px;}

  .stepper{display:flex; align-items:center; gap:0; background:var(--bg-soft); border-radius:10px; overflow:hidden; flex-shrink:0;}
  .stepper button{width:30px; height:30px; font-size:17px; font-weight:600; color:var(--accent); display:flex; align-items:center; justify-content:center;}
  .stepper button:active{background:var(--card-hover);}
  .stepper .qty{width:26px; text-align:center; font-size:14px; font-weight:700;}

  .note-toggle{width:30px; height:30px; flex-shrink:0; color:var(--text-faint); display:flex; align-items:center; justify-content:center;}
  .note-toggle svg{width:16px; height:16px;}
  .edit-btn{width:30px; height:30px; flex-shrink:0; color:var(--text-faint); display:flex; align-items:center; justify-content:center;}
  .edit-btn svg{width:15px; height:15px;}
  .note-input-row{padding:0 14px 12px; margin-top:-8px;}
  .note-input-row input{
    width:100%; background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:9px; font-size:13px; outline:none;
  }

  /* ---------- Add product ---------- */
  .add-box{margin-top:18px; display:flex; gap:8px;}
  .add-box input{
    flex:1; background:var(--card); border:1.5px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:12px; font-size:14px; outline:none; min-width:0;
  }
  .add-box input:focus{border-color:var(--accent);}
  .add-box button{
    background:var(--accent); color:#FFFFFF; font-weight:700; font-size:14px; padding:0 18px; border-radius:12px; flex-shrink:0;
  }
  .add-box button:active{transform:scale(0.96);}

  .dup-warning{
    margin-top:8px; background:rgba(210,87,74,0.08); border:1px solid rgba(210,87,74,0.35); color:#8A3226;
    padding:10px 12px; border-radius:12px; font-size:13px; display:flex; flex-direction:column; gap:8px;
  }
  .dup-warning .dw-actions{display:flex; gap:8px;}
  .dup-warning button{font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:8px;}
  .dup-warning .dw-cancel{background:rgba(30,78,110,0.08); color:var(--text);}
  .dup-warning .dw-anyway{background:var(--tomato); color:#fff;}

  /* ---------- Floating list button ---------- */
  .fab{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:40;
    background:var(--accent); color:#FFFFFF; border-radius:999px; padding:14px 24px;
    display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px;
    box-shadow:0 8px 24px rgba(30,78,110,0.28); transition:transform .15s ease;
  }
  .fab:active{transform:translateX(-50%) scale(0.96);}
  .fab svg{width:19px; height:19px;}
  .fab .fab-badge{
    background:#FFFFFF; color:var(--navy); border-radius:999px; font-size:12px; font-weight:700; padding:2px 8px;
  }

  /* ---------- Modal (final list) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal{
    position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--bg-soft);
    border-radius:22px 22px 0 0; max-height:86vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .25s ease; border-top:1px solid var(--border);
    box-shadow:0 -8px 30px rgba(30,78,110,0.15);
  }
  .modal.open{transform:translateY(0);}
  .modal-handle{width:38px; height:4px; background:var(--text-faint); border-radius:99px; margin:10px auto 6px; opacity:0.5;}
  .modal-head{padding:6px 20px 14px; border-bottom:1px solid var(--border);}
  .modal-head-top{display:flex; align-items:center; justify-content:space-between;}
  .modal-head h2{font-size:19px; font-weight:700;}
  .close-x{width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
  .close-x svg{width:18px; height:18px;}
  .progress-track{height:6px; background:var(--card); border-radius:99px; margin-top:12px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease;}
  .progress-label{font-size:12px; color:var(--text-dim); margin-top:6px;}

  .modal-body{overflow-y:auto; padding:10px 20px 26px;}
  .list-group{margin-bottom:16px;}
  .list-group-title{font-size:12px; font-weight:700; color:var(--text-faint); margin:14px 0 8px; letter-spacing:0.2px;}
  .final-row{
    display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);
  }
  .final-row:last-child{border-bottom:none;}
  .f-check{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--text-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .final-row.taken .f-check{background:var(--accent); border-color:var(--accent);}
  .f-check svg{width:13px; height:13px; opacity:0; color:#FFFFFF;}
  .final-row.taken .f-check svg{opacity:1;}
  .f-info{flex:1; min-width:0;}
  .f-name{font-size:14.5px; font-weight:600;}
  .final-row.taken .f-name{text-decoration:line-through; color:var(--text-faint);}
  .f-meta{font-size:12px; color:var(--text-dim); margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .f-qty{font-size:13px; font-weight:700; color:var(--accent); flex-shrink:0; background:var(--card); padding:4px 9px; border-radius:8px;}
  .final-row.taken .f-qty{color:var(--text-faint);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--text-dim);}
  .empty-state svg{width:44px; height:44px; color:var(--text-faint); margin-bottom:10px;}
  .empty-state p{font-size:14px; margin:0;}

  .modal-footer{padding:14px 20px 22px; border-top:1px solid var(--border); display:flex; gap:10px;}
  .reset-btn{
    flex:1; background:rgba(210,87,74,0.10); color:#8A3226; font-weight:600; font-size:13.5px;
    padding:12px; border-radius:12px; text-align:center;
  }
  .refresh-btn{
    width:44px; flex-shrink:0; background:var(--card); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--text-dim);
  }
  .refresh-btn svg{width:18px; height:18px; transition:transform .5s ease;}
  .refresh-btn.spinning svg{animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .confirm-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:110; display:none; align-items:center; justify-content:center; padding:24px;}
  .confirm-backdrop.open{display:flex;}
  .confirm-box{background:var(--card); border-radius:18px; padding:22px; max-width:300px; width:100%; text-align:center;}
  .confirm-box p{font-size:14.5px; color:var(--text-dim); margin:8px 0 18px; line-height:1.6;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{flex:1; padding:11px; border-radius:11px; font-weight:600; font-size:14px;}
  .confirm-actions .c-cancel{background:rgba(255,255,255,0.08); color:var(--text);}
  .confirm-actions .c-ok{background:var(--tomato); color:#fff;}

  .sync-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:4px;}

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:200;
    background:#FDEDEB; border:1px solid rgba(210,87,74,0.4); color:#8A3226; padding:10px 16px; border-radius:12px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; max-width:90vw; text-align:center;
    box-shadow:0 6px 20px rgba(30,78,110,0.15);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Special lists ---------- */
  .special-btn{
    display:flex; align-items:center; gap:6px; margin:14px 20px 2px; padding:11px 14px;
    background:var(--card); border:1.5px dashed var(--border); border-radius:14px; color:var(--text-dim);
    font-size:13.5px; font-weight:600; width:calc(100% - 40px); justify-content:center;
  }
  .special-btn svg{width:16px; height:16px; color:var(--accent);}
  .special-btn .sb-count{
    background:rgba(240,145,62,0.16); color:var(--accent-dark); border-radius:999px; font-size:11px; padding:1px 7px;
  }

  .active-list-banner{
    margin:12px 20px 0; padding:10px 14px; background:rgba(240,145,62,0.10); border:1px solid rgba(240,145,62,0.35);
    border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .active-list-banner .alb-text{font-size:13px; font-weight:600; color:var(--accent-dark);}
  .active-list-banner .alb-back{font-size:12.5px; color:var(--text-dim); text-decoration:underline; flex-shrink:0;}

  .special-list-row{
    display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border);
  }
  .special-list-row:last-child{border-bottom:none;}
  .special-list-row .sl-icon{
    width:38px; height:38px; border-radius:11px; background:var(--card); display:flex; align-items:center;
    justify-content:center; color:var(--accent); flex-shrink:0;
  }
  .special-list-row .sl-icon svg{width:18px; height:18px;}
  .special-list-row .sl-info{flex:1; min-width:0; text-align:right;}
  .special-list-row .sl-name{font-size:15px; font-weight:600;}
  .special-list-row .sl-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .special-list-row .sl-delete{width:32px; height:32px; flex-shrink:0; color:var(--text-faint); display:flex; align-items:center; justify-content:center;}
  .special-list-row .sl-delete svg{width:16px; height:16px;}
  .special-list-row.weekly-row .sl-icon{color:#4E9C6B;}

  .new-list-row{display:flex; gap:8px; margin-top:16px;}
  .new-list-row input{
    flex:1; background:var(--card); border:1.5px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:12px; font-size:14px; outline:none; min-width:0;
  }
  .new-list-row input:focus{border-color:var(--accent);}
  .new-list-row button{
    background:var(--accent); color:#FFFFFF; font-weight:700; font-size:14px; padding:0 18px; border-radius:12px; flex-shrink:0;
  }

  /* ---------- Edit product ---------- */
  .edit-label{font-size:12px; color:var(--text-dim); font-weight:600; margin:2px 0 8px;}
  .edit-name-row{display:flex; gap:8px;}
  .edit-name-row input{
    flex:1; background:var(--card); border:1.5px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:12px; font-size:14px; outline:none; min-width:0;
  }
  .edit-name-row input:focus{border-color:var(--accent);}
  .edit-name-row button{
    background:var(--accent); color:#FFFFFF; font-weight:700; font-size:13.5px; padding:0 16px; border-radius:12px; flex-shrink:0;
  }
  .edit-section-title{font-size:12px; font-weight:700; color:var(--text-faint); margin:20px 0 4px; letter-spacing:0.2px;}
  .edit-current-cat{font-size:13px; color:var(--text-dim); margin-bottom:10px;}
  .edit-cat-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .edit-delete-btn{
    width:100%; margin-top:24px; background:rgba(210,87,74,0.10); color:#8A3226; font-weight:600; font-size:14px;
    padding:13px; border-radius:12px; text-align:center;
  }
</style>
</head>

<script>
(function(){

  // ---------- constants ----------
  var CATS = [
    { key:'milk', name:'מוצרי חלב', icon:iconMilk },
    { key:'produce', name:'ירקות ופירות', icon:iconProduce },
    { key:'frozen', name:'קפואים', icon:iconFrozen },
    { key:'cleaning', name:'חומרי ניקוי והיגיינה', icon:iconCleaning },
    { key:'dry', name:'מוצרים יבשים', icon:iconDry },
    { key:'misc', name:'שונות', icon:iconMisc }
  ];

  var DEFAULT_CATALOG = {
    milk: ['חלב 3%','חלב 1%','גבינה צהובה','גבינה לבנה','יוגורט','קוטג\'','חמאה','ביצים','שמנת'],
    produce: ['עגבניות','מלפפונים','בצל','תפוחי אדמה','גזר','פלפל','חסה','בננות','תפוחים','לימון'],
    frozen: ['אפונה קפואה','תירס קפוא','פיצה קפואה','שניצל קפוא','גלידה','ירקות מוקפאים','בצק עלים'],
    cleaning: ['סבון כלים','אקונומיקה','נייר טואלט','מגבות נייר','שמפו','משחת שיניים','סבון ידיים'],
    dry: ['אורז','פסטה','קמח','סוכר','שמן','קטשופ','מיונז','קפה','תה','עדשים','שיבולת שועל'],
    misc: ['שקיות זבל','נייר כסף','מגבונים לחים','סוללות','נרות']
  };

  var AVATAR_COLORS = ['#F0913E','#D2574A','#4E9C6B','#3E8FC4','#9A6FC9','#C99A2E','#2FA898'];

  var PERSONAL_KEY = 'super-keto-my-name';
  var WEEKLY_ID = 'weekly';
  var WEEKLY_NAME = 'קניות שבועיות';

  // ---------- state ----------
  var state = {
    myName: null,
    activeCat: CATS[0].key,
    activeListId: WEEKLY_ID,
    data: { catalog: {}, lists: {} }, // shared
    pendingDup: null, // {category, name}
    noteOpenId: null,
    searchByCat: {},
    editingProduct: null, // {id, catKey}
    pendingConfirmAction: null
  };

  function getActiveList(){
    if (!state.data.lists[state.activeListId]){
      // fallback safety: list was deleted elsewhere, drop back to weekly
      state.activeListId = WEEKLY_ID;
    }
    return state.data.lists[state.activeListId];
  }
  function getActiveSelections(){
    return getActiveList().selections;
  }

  function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

  function avatarColor(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name){
    return (name || '?').trim().slice(0,1).toUpperCase();
  }

  function seedCatalogIfEmpty(catalog){
    var changed = false;
    CATS.forEach(function(c){
      if (!catalog[c.key] || !catalog[c.key].length){
        catalog[c.key] = DEFAULT_CATALOG[c.key].map(function(n){ return { id: uid(), name: n }; });
        changed = true;
      }
    });
    return changed;
  }

  function findExisting(catalog, name, excludeId){
    var norm = name.trim().toLowerCase();
    for (var i=0;i<CATS.length;i++){
      var key = CATS[i].key;
      var list = catalog[key] || [];
      for (var j=0;j<list.length;j++){
        if (excludeId && list[j].id === excludeId) continue;
        if (list[j].name.trim().toLowerCase() === norm){
          return { category: key, product: list[j] };
        }
      }
    }
    return null;
  }

  function locateProduct(id){
    for (var i=0;i<CATS.length;i++){
      var list = state.data.catalog[CATS[i].key] || [];
      for (var j=0;j<list.length;j++){
        if (list[j].id === id) return { product: list[j], catKey: CATS[i].key, catName: CATS[i].name };
      }
    }
    return null;
  }

  function normalizeData(data){
    if (!data.catalog) data.catalog = {};
    if (!data.lists){
      // migrate legacy flat `selections` (pre-multi-list version) into the weekly list
      data.lists = {};
      data.lists[WEEKLY_ID] = { name: WEEKLY_NAME, special:false, selections: data.selections || {} };
      delete data.selections;
    }
    if (!data.lists[WEEKLY_ID]){
      data.lists[WEEKLY_ID] = { name: WEEKLY_NAME, special:false, selections:{} };
    }
    Object.keys(data.lists).forEach(function(id){
      if (!data.lists[id].selections) data.lists[id].selections = {};
    });
    return data;
  }

  // ---------- storage (Firebase Firestore) ----------
  var toastTimer = null;
  function showToast(msg){
    var t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  var firestoreDb = null;
  function getDb(){
    if (firestoreDb) return firestoreDb;
    if (typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('YOUR_') === 0){
      showToast('חסרה הגדרת Firebase — ראו את ההוראות למעלה בקובץ');
      throw new Error('Firebase not configured');
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    firestoreDb = firebase.firestore();
    return firestoreDb;
  }

  var SHARED_DOC_PATH = ['super-keto', 'data'];

  async function loadShared(){
    try{
      var docRef = getDb().collection(SHARED_DOC_PATH[0]).doc(SHARED_DOC_PATH[1]);
      var snap = await docRef.get();
      var data = snap.exists ? snap.data() : { catalog:{}, lists:{} };
      data = normalizeData(data);
      var needsSeed = seedCatalogIfEmpty(data.catalog);
      if (needsSeed) await saveShared(data);
      state.data = data;
    } catch(e){
      console.error('load failed', e);
      state.data = normalizeData({ catalog:{}, lists:{} });
      seedCatalogIfEmpty(state.data.catalog);
      try{ await saveShared(state.data); } catch(e2){}
    }
  }

  async function saveShared(data){
    data = data || state.data;
    try{
      var docRef = getDb().collection(SHARED_DOC_PATH[0]).doc(SHARED_DOC_PATH[1]);
      await docRef.set(JSON.parse(JSON.stringify(data)));
      return true;
    } catch(e){
      console.error('save failed', e);
      showToast('לא הצלחנו לשמור כרגע — נסו שוב בעוד רגע');
      return false;
    }
  }

  async function loadMyName(){
    try{
      var v = localStorage.getItem(PERSONAL_KEY);
      if (v) state.myName = v;
    } catch(e){ /* not set yet, or storage blocked */ }
  }
  async function saveMyName(name){
    try{ localStorage.setItem(PERSONAL_KEY, name); } catch(e){}
  }

  // ---------- icons ----------
  function svgWrap(inner){ return '<svg viewBox="0 0 24 24" fill="none">' + inner + '</svg>'; }
  function iconMilk(){ return svgWrap('<path d="M9 2h6v4l2.5 3.5V21a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V9.5L9 6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 13h9" stroke="currentColor" stroke-width="1.8"/>'); }
  function iconProduce(){ return svgWrap('<circle cx="10" cy="14" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M10 7c0-2 1.5-4 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 6c1.5 1 2.5 2.7 2.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'); }
  function iconFrozen(){ return svgWrap('<path d="M12 2v20M4 7l16 10M20 7L4 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'); }
  function iconCleaning(){ return svgWrap('<path d="M9 3h4v3H9V3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 6h6l1 15H7L8 6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12h5" stroke="currentColor" stroke-width="1.8"/>'); }
  function iconDry(){ return svgWrap('<rect x="4" y="8" width="16" height="13" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 8V6a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8"/>'); }
  function iconMisc(){ return svgWrap('<circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/>'); }
  function iconCheck(){ return svgWrap('<path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'); }
  function iconCart(){ return svgWrap('<path d="M6 6h15l-1.5 9h-12L6 6zM6 6L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'); }
  function iconNote(){ return svgWrap('<path d="M4 4h16v13l-4 3H4V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'); }
  function iconStar(){ return svgWrap('<path d="M12 3l2.2 5.4L20 9l-4.4 3.8L17 19l-5-3.2L7 19l1.4-6.2L4 9l5.8-.6L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'); }
  function iconTrash(){ return svgWrap('<path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'); }
  function iconEdit(){ return svgWrap('<path d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19l-4.2 1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'); }

  // ---------- render ----------
  var $ = function(id){ return document.getElementById(id); };

  function renderMe(){
    if (!state.myName) return;
    $('me-name').textContent = state.myName;
    var av = $('me-avatar');
    av.textContent = initials(state.myName);
    av.style.background = avatarColor(state.myName);
  }

  function renderChips(){
    var sels = getActiveSelections();
    var counts = {};
    CATS.forEach(function(c){ counts[c.key] = 0; });
    Object.keys(sels).forEach(function(id){
      if (sels[id].taken) return;
      var loc = locateProduct(id);
      if (loc) counts[loc.catKey]++;
    });
    var html = CATS.map(function(c){
      var count = counts[c.key];
      var active = c.key === state.activeCat;
      return '<button class="chip ' + (active ? 'active' : '') + '" data-cat="' + c.key + '">' +
        c.icon() + '<span>' + c.name + '</span>' +
        (count ? '<span class="chip-count">' + count + '</span>' : '') +
        '</button>';
    }).join('');
    $('chips').innerHTML = html;
  }

  function renderSpecialButton(){
    var specialIds = Object.keys(state.data.lists).filter(function(id){ return id !== WEEKLY_ID; });
    var badge = $('special-count');
    if (specialIds.length){
      badge.style.display = 'inline-block';
      badge.textContent = specialIds.length;
    } else {
      badge.style.display = 'none';
    }

    var banner = $('active-list-banner');
    if (state.activeListId !== WEEKLY_ID){
      var list = getActiveList();
      banner.style.display = 'flex';
      $('alb-text').textContent = 'עורכים כעת: ' + list.name;
    } else {
      banner.style.display = 'none';
    }
  }

  function renderCategory(){
    var cat = CATS.find(function(c){ return c.key === state.activeCat; });
    $('cat-icon').innerHTML = cat.icon();
    $('cat-name').textContent = cat.name;

    var q = state.searchByCat[cat.key] || '';
    var searchInput = $('cat-search-input');
    if (searchInput.value !== q) searchInput.value = q;
    $('cat-search-clear').classList.toggle('show', !!q);

    renderProductGrid();

    $('dup-warning-slot').innerHTML = '';
    if (state.pendingDup){
      var d = state.pendingDup;
      var existingCatName = CATS.find(function(c){ return c.key === d.foundCategory; }).name;
      $('dup-warning-slot').innerHTML =
        '<div class="dup-warning">' +
          '<span>המוצר "' + escapeHtml(d.name) + '" כבר קיים בקטגוריית "' + existingCatName + '"</span>' +
          '<div class="dw-actions">' +
            '<button class="dw-cancel" id="dw-cancel">ביטול</button>' +
            '<button class="dw-anyway" id="dw-anyway">הוסף בכל זאת כאן</button>' +
          '</div>' +
        '</div>';
      $('dw-cancel').onclick = function(){ state.pendingDup = null; renderCategory(); };
      $('dw-anyway').onclick = function(){
        addProductToCatalog(state.activeCat, state.pendingDup.name);
        state.pendingDup = null;
        $('new-product-input').value = '';
        renderCategory();
      };
    }
  }

  function renderProductGrid(){
    var sels = getActiveSelections();
    var cat = CATS.find(function(c){ return c.key === state.activeCat; });
    var q = (state.searchByCat[cat.key] || '').trim();

    var list = (state.data.catalog[cat.key] || []).slice()
      .filter(function(p){ return !q || p.name.indexOf(q) !== -1; })
      .sort(function(a,b){
        var sa = !!sels[a.id], sb = !!sels[b.id];
        if (sa !== sb) return sa ? -1 : 1;
        return a.name.localeCompare(b.name, 'he');
      });

    var html = list.map(function(p){
      var sel = sels[p.id];
      var selected = !!sel;
      var qty = sel ? sel.quantity : 1;
      var noteOpen = state.noteOpenId === p.id;
      var noteVal = sel && sel.note ? sel.note : '';
      var row = '<div class="product-row ' + (selected ? 'selected' : '') + '" data-pid="' + p.id + '">' +
        '<button class="check" data-action="toggle" data-pid="' + p.id + '">' + iconCheck() + '</button>' +
        '<div class="p-name">' + escapeHtml(p.name) +
          (selected && sel.note ? '<span class="p-note">' + escapeHtml(sel.note) + '</span>' : '') +
        '</div>' +
        (selected ? (
          '<button class="note-toggle" data-action="note-toggle" data-pid="' + p.id + '">' + iconNote() + '</button>' +
          '<div class="stepper">' +
            '<button data-action="dec" data-pid="' + p.id + '">−</button>' +
            '<span class="qty">' + qty + '</span>' +
            '<button data-action="inc" data-pid="' + p.id + '">+</button>' +
          '</div>'
        ) : '') +
        '<button class="edit-btn" data-action="edit" data-pid="' + p.id + '">' + iconEdit() + '</button>' +
        '</div>';
      if (selected && noteOpen){
        row += '<div class="note-input-row"><input type="text" placeholder="הערה (מותג, גודל וכו׳)" maxlength="60" data-note-pid="' + p.id + '" value="' + escapeHtml(noteVal) + '"></div>';
      }
      return row;
    }).join('');

    var emptyMsg = q ? 'לא נמצאו מוצרים התואמים ל"' + escapeHtml(q) + '"' : 'אין עדיין מוצרים בקטגוריה זו';
    $('product-grid').innerHTML = html || ('<div class="empty-state"><p>' + emptyMsg + '</p></div>');

    var noteInput = document.querySelector('[data-note-pid]');
    if (noteInput){
      noteInput.addEventListener('blur', function(){
        var pid = this.getAttribute('data-note-pid');
        var sel = getActiveSelections()[pid];
        if (sel){ sel.note = this.value.trim(); saveShared(); }
      });
      noteInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') this.blur(); });
    }
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderFab(){
    var sels = getActiveSelections();
    var count = Object.values(sels).filter(function(s){ return !s.taken; }).length;
    $('fab-badge').textContent = count;
  }

  function renderModal(){
    var selections = getActiveSelections();
    var listName = getActiveList().name;
    $('modal-title').textContent = state.activeListId === WEEKLY_ID ? 'רשימה סופית' : 'רשימה סופית — ' + listName;
    var ids = Object.keys(selections);
    var total = ids.length;
    var takenCount = ids.filter(function(id){ return selections[id].taken; }).length;
    var pct = total ? Math.round((takenCount/total)*100) : 0;
    $('progress-fill').style.width = pct + '%';
    $('progress-label').textContent = takenCount + ' מתוך ' + total + ' נלקחו';

    if (!total){
      $('modal-body').innerHTML = '<div class="empty-state">' + iconCart() + '<p>עדיין לא נבחרו מוצרים.<br>סמנו מוצרים בקטגוריות כדי להוסיף אותם לרשימה.</p></div>';
      return;
    }

    function rowHtml(id){
      var sel = selections[id];
      var info = locateProduct(id);
      if (!info) return '';
      return '<div class="final-row ' + (sel.taken ? 'taken' : '') + '" data-pid="' + id + '">' +
        '<button class="f-check" data-action="final-toggle" data-pid="' + id + '">' + iconCheck() + '</button>' +
        '<div class="f-info">' +
          '<div class="f-name">' + escapeHtml(info.product.name) + '</div>' +
          '<div class="f-meta">' +
            '<span>' + escapeHtml(sel.addedBy || '?') + '</span>' +
            (sel.note ? '<span>· ' + escapeHtml(sel.note) + '</span>' : '') +
            (sel.taken && sel.takenBy ? '<span>· נלקח ע"י ' + escapeHtml(sel.takenBy) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="f-qty">' + sel.quantity + '</div>' +
      '</div>';
    }

    var toBuy = ids.filter(function(id){ return !selections[id].taken; });
    var taken = ids.filter(function(id){ return selections[id].taken; });

    // group toBuy by category
    var grouped = {};
    toBuy.forEach(function(id){
      var info = locateProduct(id);
      if (!info) return;
      grouped[info.catKey] = grouped[info.catKey] || [];
      grouped[info.catKey].push(id);
    });

    var html = '';
    CATS.forEach(function(c){
      if (grouped[c.key] && grouped[c.key].length){
        html += '<div class="list-group"><div class="list-group-title">' + c.name + '</div>' +
          grouped[c.key].map(rowHtml).join('') + '</div>';
      }
    });
    if (taken.length){
      html += '<div class="list-group"><div class="list-group-title">כבר נלקח</div>' +
        taken.map(rowHtml).join('') + '</div>';
    }
    $('modal-body').innerHTML = html;
  }

  function renderSpecialLists(){
    var ids = Object.keys(state.data.lists).filter(function(id){ return id !== WEEKLY_ID; })
      .sort(function(a,b){ return (state.data.lists[b].createdAt||0) - (state.data.lists[a].createdAt||0); });

    var weeklySel = state.data.lists[WEEKLY_ID].selections;
    var weeklyOpen = Object.values(weeklySel).filter(function(s){ return !s.taken; }).length;
    var html = '<div class="special-list-row weekly-row" data-list="' + WEEKLY_ID + '">' +
      '<div class="sl-icon">' + iconCart() + '</div>' +
      '<div class="sl-info"><div class="sl-name">' + WEEKLY_NAME + '</div>' +
        '<div class="sl-meta">' + weeklyOpen + ' פריטים פתוחים</div></div>' +
      '</div>';

    html += ids.map(function(id){
      var l = state.data.lists[id];
      var open = Object.values(l.selections).filter(function(s){ return !s.taken; }).length;
      return '<div class="special-list-row" data-list="' + id + '">' +
        '<div class="sl-icon">' + iconStar() + '</div>' +
        '<div class="sl-info"><div class="sl-name">' + escapeHtml(l.name) + '</div>' +
          '<div class="sl-meta">' + open + ' פריטים פתוחים' + (l.createdBy ? ' · נוצרה ע"י ' + escapeHtml(l.createdBy) : '') + '</div></div>' +
        '<button class="sl-delete" data-delete-list="' + id + '">' + iconTrash() + '</button>' +
      '</div>';
    }).join('');

    $('special-list-rows').innerHTML = html;
  }

  function renderAll(){
    renderMe();
    renderChips();
    renderSpecialButton();
    renderCategory();
    renderFab();
    if ($('modal').classList.contains('open')) renderModal();
    if ($('special-modal').classList.contains('open')) renderSpecialLists();
    if ($('edit-modal').classList.contains('open')) renderEditModal();
  }

  // ---------- actions ----------
  function toggleSelect(pid){
    var sels = getActiveSelections();
    if (sels[pid]){
      delete sels[pid];
    } else {
      sels[pid] = { quantity: 1, addedBy: state.myName, taken: false, takenBy: null, note: '', addedAt: Date.now() };
    }
    saveShared();
    renderAll();
  }

  function changeQty(pid, delta){
    var sel = getActiveSelections()[pid];
    if (!sel) return;
    sel.quantity = Math.max(1, sel.quantity + delta);
    saveShared();
    renderAll();
  }

  function toggleFinal(pid){
    var sel = getActiveSelections()[pid];
    if (!sel) return;
    sel.taken = !sel.taken;
    sel.takenBy = sel.taken ? state.myName : null;
    saveShared();
    renderAll();
  }

  function addProductToCatalog(catKey, name){
    var trimmed = name.trim();
    if (!trimmed) return;
    if (!state.data.catalog[catKey]) state.data.catalog[catKey] = [];
    state.data.catalog[catKey].push({ id: uid(), name: trimmed });
    saveShared();
  }

  function handleAddProduct(){
    var input = $('new-product-input');
    var name = input.value.trim();
    if (!name) return;
    var existing = findExisting(state.data.catalog, name);
    if (existing && existing.category !== state.activeCat){
      state.pendingDup = { name: name, foundCategory: existing.category };
      renderCategory();
      return;
    }
    if (existing && existing.category === state.activeCat){
      input.value = '';
      return; // already exists here, nothing to do
    }
    addProductToCatalog(state.activeCat, name);
    input.value = '';
    state.pendingDup = null;
    renderCategory();
  }

  async function resetRound(){
    getActiveList().selections = {};
    await saveShared();
    renderAll();
  }

  function createSpecialList(name){
    var trimmed = name.trim();
    if (!trimmed) return;
    var id = 'l_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
    state.data.lists[id] = { name: trimmed, special:true, createdBy: state.myName, createdAt: Date.now(), selections:{} };
    saveShared();
    state.activeListId = id;
    state.activeCat = CATS[0].key;
    closeSpecialModal();
    renderAll();
    showToast('הרשימה "' + trimmed + '" נוצרה ונבחרה');
  }

  function switchToList(id){
    if (!state.data.lists[id]) return;
    state.activeListId = id;
    closeSpecialModal();
    renderAll();
  }

  function deleteSpecialList(id){
    if (id === WEEKLY_ID) return;
    var name = state.data.lists[id] ? state.data.lists[id].name : '';
    delete state.data.lists[id];
    if (state.activeListId === id) state.activeListId = WEEKLY_ID;
    saveShared();
    renderSpecialLists();
    renderAll();
    showToast('הרשימה "' + name + '" נמחקה');
  }

  // ---------- events ----------
  function wireEvents(){
    $('chips').addEventListener('click', function(e){
      var btn = e.target.closest('.chip');
      if (!btn) return;
      state.activeCat = btn.getAttribute('data-cat');
      state.pendingDup = null;
      renderChips();
      renderCategory();
    });

    $('product-grid').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var pid = btn.getAttribute('data-pid');
      var action = btn.getAttribute('data-action');
      if (action === 'toggle') toggleSelect(pid);
      else if (action === 'inc') changeQty(pid, 1);
      else if (action === 'dec') changeQty(pid, -1);
      else if (action === 'edit'){ openEditProduct(pid, state.activeCat); }
      else if (action === 'note-toggle'){
        state.noteOpenId = state.noteOpenId === pid ? null : pid;
        renderCategory();
        var inp = document.querySelector('[data-note-pid="' + pid + '"]');
        if (inp) inp.focus();
      }
    });

    $('add-product-btn').addEventListener('click', handleAddProduct);
    $('new-product-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') handleAddProduct(); });

    $('cat-search-input').addEventListener('input', function(){
      state.searchByCat[state.activeCat] = this.value;
      $('cat-search-clear').classList.toggle('show', !!this.value);
      renderProductGrid();
    });
    $('cat-search-clear').addEventListener('click', function(){
      state.searchByCat[state.activeCat] = '';
      var input = $('cat-search-input');
      input.value = '';
      this.classList.remove('show');
      renderProductGrid();
      input.focus();
    });

    $('fab').addEventListener('click', openModal);
    $('close-modal').addEventListener('click', closeModal);
    $('modal-backdrop').addEventListener('click', closeModal);

    $('special-btn').addEventListener('click', openSpecialModal);
    $('close-special-modal').addEventListener('click', closeSpecialModal);
    $('special-modal-backdrop').addEventListener('click', closeSpecialModal);
    $('alb-back').addEventListener('click', function(){ switchToList(WEEKLY_ID); });

    $('create-list-btn').addEventListener('click', function(){
      createSpecialList($('new-list-input').value);
      $('new-list-input').value = '';
    });
    $('new-list-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        createSpecialList(this.value);
        this.value = '';
      }
    });

    $('special-list-rows').addEventListener('click', function(e){
      var delBtn = e.target.closest('[data-delete-list]');
      if (delBtn){
        e.stopPropagation();
        var id = delBtn.getAttribute('data-delete-list');
        var name = state.data.lists[id] ? state.data.lists[id].name : 'הרשימה';
        showConfirm(
          'מחיקת רשימה',
          'למחוק את "' + name + '"? כל הפריטים בה יימחקו.',
          'כן, מחק',
          function(){ deleteSpecialList(id); }
        );
        return;
      }
      var row = e.target.closest('[data-list]');
      if (row) switchToList(row.getAttribute('data-list'));
    });

    $('close-edit-modal').addEventListener('click', closeEditModal);
    $('edit-modal-backdrop').addEventListener('click', closeEditModal);
    $('edit-save-name-btn').addEventListener('click', saveProductName);
    $('edit-name-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') saveProductName(); });
    $('edit-category-chips').addEventListener('click', function(e){
      var btn = e.target.closest('[data-move-cat]');
      if (!btn) return;
      moveProduct(btn.getAttribute('data-move-cat'));
    });
    $('edit-delete-btn').addEventListener('click', deleteProductAction);

    $('modal-body').addEventListener('click', function(e){
      var btn = e.target.closest('[data-action="final-toggle"]');
      if (!btn) return;
      toggleFinal(btn.getAttribute('data-pid'));
    });

    $('reset-round-btn').addEventListener('click', function(){
      showConfirm(
        'להתחיל קנייה חדשה?',
        'כל הסימונים והכמויות ברשימה הנוכחית יימחקו. רשימת המוצרים הכללית תישאר כמו שהיא.',
        'כן, אפס',
        resetRound
      );
    });
    $('confirm-cancel').addEventListener('click', closeConfirm);
    $('confirm-ok').addEventListener('click', async function(){
      var action = state.pendingConfirmAction;
      closeConfirm();
      if (action) await action();
    });

    $('refresh-btn').addEventListener('click', async function(){
      var btn = this;
      btn.classList.add('spinning');
      await loadShared();
      renderAll();
      setTimeout(function(){ btn.classList.remove('spinning'); }, 400);
    });

    $('me-badge').addEventListener('click', openRenameModal);
    $('close-rename-modal').addEventListener('click', closeRenameModal);
    $('rename-modal-backdrop').addEventListener('click', closeRenameModal);
    $('rename-save-btn').addEventListener('click', saveRename);
    $('rename-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') saveRename(); });

    $('gate-input').addEventListener('input', function(){
      $('gate-go').disabled = !this.value.trim();
    });
    $('gate-input').addEventListener('keydown', function(e){ if (e.key === 'Enter' && this.value.trim()) enterApp(); });
    $('gate-go').addEventListener('click', enterApp);
  }

  function openModal(){
    renderModal();
    $('modal-backdrop').classList.add('open');
    $('modal').classList.add('open');
  }
  function closeModal(){
    $('modal-backdrop').classList.remove('open');
    $('modal').classList.remove('open');
  }

  function openSpecialModal(){
    renderSpecialLists();
    $('special-modal-backdrop').classList.add('open');
    $('special-modal').classList.add('open');
  }
  function closeSpecialModal(){
    $('special-modal-backdrop').classList.remove('open');
    $('special-modal').classList.remove('open');
  }

  function showConfirm(title, message, okLabel, onConfirm){
    $('confirm-title').textContent = title;
    $('confirm-message').textContent = message;
    $('confirm-ok').textContent = okLabel || 'אישור';
    state.pendingConfirmAction = onConfirm;
    $('confirm-backdrop').classList.add('open');
  }
  function closeConfirm(){
    $('confirm-backdrop').classList.remove('open');
    state.pendingConfirmAction = null;
  }

  function openRenameModal(){
    $('rename-input').value = state.myName || '';
    $('rename-modal-backdrop').classList.add('open');
    $('rename-modal').classList.add('open');
    setTimeout(function(){ $('rename-input').focus(); }, 50);
  }
  function closeRenameModal(){
    $('rename-modal-backdrop').classList.remove('open');
    $('rename-modal').classList.remove('open');
  }
  function saveRename(){
    var newName = $('rename-input').value.trim();
    if (!newName) return;
    state.myName = newName;
    saveMyName(state.myName);
    renderMe();
    closeRenameModal();
  }

  function openEditProduct(pid, catKey){
    state.editingProduct = { id: pid, catKey: catKey };
    renderEditModal();
    $('edit-modal-backdrop').classList.add('open');
    $('edit-modal').classList.add('open');
  }
  function closeEditModal(){
    $('edit-modal-backdrop').classList.remove('open');
    $('edit-modal').classList.remove('open');
    state.editingProduct = null;
  }

  function renderEditModal(){
    var ep = state.editingProduct;
    if (!ep) return;
    var loc = locateProduct(ep.id);
    if (!loc){ closeEditModal(); return; }
    ep.catKey = loc.catKey;
    $('edit-name-input').value = loc.product.name;
    $('edit-dup-warning').innerHTML = '';
    $('edit-current-cat').textContent = 'כרגע ב: ' + loc.catName;
    var chipsHtml = CATS.filter(function(c){ return c.key !== loc.catKey; }).map(function(c){
      return '<button class="chip" data-move-cat="' + c.key + '">' + c.icon() + '<span>' + c.name + '</span></button>';
    }).join('');
    $('edit-category-chips').innerHTML = chipsHtml;
  }

  function renderEditDupWarning(existingCategoryKey, name){
    var existingCatName = CATS.find(function(c){ return c.key === existingCategoryKey; }).name;
    $('edit-dup-warning').innerHTML =
      '<div class="dup-warning">' +
        '<span>המוצר "' + escapeHtml(name) + '" כבר קיים בקטגוריית "' + existingCatName + '"</span>' +
        '<div class="dw-actions">' +
          '<button class="dw-cancel" id="edit-dw-cancel">ביטול</button>' +
          '<button class="dw-anyway" id="edit-dw-anyway">שמירה בכל זאת</button>' +
        '</div>' +
      '</div>';
    $('edit-dw-cancel').onclick = function(){ $('edit-dup-warning').innerHTML = ''; };
    $('edit-dw-anyway').onclick = function(){ $('edit-dup-warning').innerHTML = ''; applyRename(name); };
  }

  function applyRename(name){
    var ep = state.editingProduct;
    if (!ep) return;
    var loc = locateProduct(ep.id);
    if (!loc) return;
    loc.product.name = name;
    saveShared();
    renderChips();
    if (state.activeCat === loc.catKey) renderProductGrid();
    showToast('השם עודכן');
    renderEditModal();
  }

  function saveProductName(){
    var ep = state.editingProduct;
    if (!ep) return;
    var name = $('edit-name-input').value.trim();
    if (!name){ showToast('יש להזין שם מוצר'); return; }
    var existing = findExisting(state.data.catalog, name, ep.id);
    if (existing && existing.category === ep.catKey){
      showToast('כבר קיים מוצר בשם זה בקטגוריה זו');
      return;
    }
    if (existing && existing.category !== ep.catKey){
      renderEditDupWarning(existing.category, name);
      return;
    }
    applyRename(name);
  }

  function moveProduct(newCatKey){
    var ep = state.editingProduct;
    if (!ep || newCatKey === ep.catKey) return;
    var loc = locateProduct(ep.id);
    if (!loc) return;
    var targetList = state.data.catalog[newCatKey] || [];
    var nameNorm = loc.product.name.trim().toLowerCase();
    var clash = targetList.some(function(p){ return p.name.trim().toLowerCase() === nameNorm; });
    if (clash){
      showToast('כבר קיים מוצר בשם זה בקטגוריית ' + CATS.find(function(c){ return c.key === newCatKey; }).name);
      return;
    }
    state.data.catalog[loc.catKey] = state.data.catalog[loc.catKey].filter(function(p){ return p.id !== ep.id; });
    if (!state.data.catalog[newCatKey]) state.data.catalog[newCatKey] = [];
    state.data.catalog[newCatKey].push(loc.product);
    var oldCatKey = ep.catKey;
    ep.catKey = newCatKey;
    saveShared();
    renderChips();
    if (state.activeCat === oldCatKey || state.activeCat === newCatKey) renderProductGrid();
    renderEditModal();
    showToast('המוצר הועבר ל"' + CATS.find(function(c){ return c.key === newCatKey; }).name + '"');
  }

  function deleteProductAction(){
    var ep = state.editingProduct;
    if (!ep) return;
    var loc = locateProduct(ep.id);
    var name = loc ? loc.product.name : 'המוצר';
    var pid = ep.id;
    var catKey = loc ? loc.catKey : null;
    showConfirm(
      'מחיקת מוצר',
      'למחוק את "' + name + '" מהקטלוג ומכל הרשימות? הפעולה בלתי הפיכה.',
      'כן, מחק',
      function(){
        if (catKey){
          state.data.catalog[catKey] = state.data.catalog[catKey].filter(function(p){ return p.id !== pid; });
        }
        Object.keys(state.data.lists).forEach(function(lid){
          delete state.data.lists[lid].selections[pid];
        });
        saveShared();
        closeEditModal();
        renderAll();
        showToast('"' + name + '" נמחק');
      }
    );
  }

  async function enterApp(){
    var name = $('gate-input').value.trim();
    if (!name) return;
    state.myName = name;
    await saveMyName(name);
    $('gate').style.display = 'none';
    await init();
  }

  // ---------- polling ----------
  var pollInterval = null;
  function startPolling(){
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async function(){
      if (document.hidden) return;
      await loadShared();
      renderAll();
    }, 7000);
  }

  // ---------- init ----------
  async function init(){
    await loadShared();
    renderAll();
    startPolling();
  }

  (async function boot(){
    wireEvents();
    await loadMyName();
    if (state.myName){
      $('gate').style.display = 'none';
      await init();
    }
  })();

})();
</script>
</body>
</html>
